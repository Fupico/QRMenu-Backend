services:
  postgres:
    image: postgres:17
    container_name: qrmenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qrmenu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qrmenu-api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=qrmenu_db;Username=postgres;Password=postgres
      SeedData__AdminEmail: admin@qrmenu.local
      SeedData__AdminPassword: ChangeMe123!
      JwtSettings__SecretKey: ChangeThisSecretKeyForProduction123!
      JwtSettings__Issuer: FuPiCoMenu
      JwtSettings__Audience: FuPiCoAudience
    ports:
      - "8080:8080"

volumes:
  postgres-data:
